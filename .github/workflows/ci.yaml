name: CI - Build, Push, and Update Manifest

on:
  push:
    branches: [main]
    paths:
      - 'app/**'

permissions:
  contents: write   # needed so this workflow can commit back to the repo

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: github-action-eks-app

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test

  build-push-and-update-manifest:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        working-directory: app
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Update deployment.yaml with new image and commit
        env:
          IMAGE: ${{ steps.build-image.outputs.image }}
        run: |
          sed -i "s|image: .*|image: $IMAGE|" kubernetes/deployment.yaml
          git config user.email "ci-bot@github-actions.local"
          git config user.name "CI Bot"
          git add kubernetes/deployment.yaml
          git commit -m "chore: deploy image $IMAGE" || echo "No changes to commit"
          git push